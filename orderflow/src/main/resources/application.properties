spring.application.name=orderflow
server.port=${PORT:8080}

# Local defaults match ../compose.yaml. Override these with environment variables
# in deployment environments rather than committing credentials to source control.
spring.datasource.url=${ORDERFLOW_DB_URL:jdbc:postgresql://localhost:5433/orderflow}
spring.datasource.username=${ORDERFLOW_DB_USERNAME:orderflow}
spring.datasource.password=${ORDERFLOW_DB_PASSWORD:orderflow-local}

# Flyway is the sole schema owner; Hibernate validates migrations rather than
# creating or changing tables at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Local demo credentials. Override these values through environment variables
# before exposing the application outside your development machine.
orderflow.security.admin.username=${ORDERFLOW_ADMIN_USERNAME:admin}
orderflow.security.admin.password=${ORDERFLOW_ADMIN_PASSWORD:admin-local-only}
orderflow.security.operator.username=${ORDERFLOW_OPERATOR_USERNAME:operator}
orderflow.security.operator.password=${ORDERFLOW_OPERATOR_PASSWORD:operator-local-only}

# The public playground is shared, isolated from authenticated API records,
# and restored to its seed catalog after a period with no demo requests.
orderflow.demo.idle-ttl=${ORDERFLOW_DEMO_IDLE_TTL:PT20M}
orderflow.demo.cleanup-interval=${ORDERFLOW_DEMO_CLEANUP_INTERVAL:PT1M}
